<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agendamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Agendamentos
            <span class="badge text-bg-secondary align-middle" th:text="${#lists.size(agendamentos)} + ' registro(s)'">0 registro(s)</span>
        </h1>
        <a th:href="@{/agendamentos/novo}" class="btn btn-app"><i class="bi bi-plus-lg"></i> Novo agendamento</a>
    </div>

    <!-- Mensagem de sucesso: fragmento reaproveitado do layout -->
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- Filtro: envia a escolha como ?status=... para o próprio endereço da lista -->
    <form th:action="@{/agendamentos}" method="get" class="d-flex gap-2 mb-3">
        <select name="status" class="form-select w-auto">
            <option value="">Todas as situações</option>
            <option th:each="item : ${situacoes}" th:value="${item}" th:text="${item.descricao}"
                    th:selected="${item == status}">Situação</option>
        </select>
        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-funnel"></i> Filtrar</button>
    </form>

    <!-- Mensagem quando ainda não há registros -->
    <div th:if="${#lists.isEmpty(agendamentos)}" class="alert alert-info">Nenhum registro encontrado.</div>

    <div class="card shadow-sm" th:unless="${#lists.isEmpty(agendamentos)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Observação</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- th:each repete a linha <tr> para cada item da lista "agendamentos" -->
                <tr th:each="agendamento : ${agendamentos}">
                    <td th:text="${#temporals.format(agendamento.data, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${#temporals.format(agendamento.horario, 'HH:mm')}">08:00</td>
                    <td th:text="${agendamento.cliente.nome}">Cliente</td>
                    <td th:text="${agendamento.servico.nome}">Serviço</td>
                    <td th:text="${agendamento.observacao}">Observação</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${agendamento.status.cor}" th:text="${agendamento.status.descricao}">Situação</span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/agendamentos/{id}/editar(id=${agendamento.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> Editar</a>
                        <!-- Mudar a situação: formulário POST que envia a nova situação -->
                        <form th:if="${agendamento.status.name() == 'AGENDADO'}" th:action="@{/agendamentos/{id}/status(status='CONCLUIDO', id=${agendamento.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success"><i class="bi bi-check2-circle"></i> Concluir</button>
                        </form>
                        <form th:if="${agendamento.status.name() == 'AGENDADO'}" th:action="@{/agendamentos/{id}/status(status='CANCELADO', id=${agendamento.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-x-circle"></i> Cancelar</button>
                        </form>
                        <!-- Excluir usa um formulário POST; o confirm() pede confirmação antes de enviar -->
                        <form th:action="@{/agendamentos/{id}/excluir(id=${agendamento.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Confirma a exclusão deste registro?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
