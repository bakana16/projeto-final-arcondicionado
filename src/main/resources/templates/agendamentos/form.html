<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agendamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <!-- O mesmo formulário serve para cadastrar (id vazio) e para editar (id preenchido) -->
    <h1 class="h4 mb-3" th:text="${agendamento.id == null} ? 'Novo agendamento' : 'Editar agendamento'">Novo agendamento</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- th:object liga o formulário ao objeto "agendamento"; *{campo} = um atributo desse objeto -->
            <form th:action="@{/agendamentos/salvar}" th:object="${agendamento}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="cliente">Cliente *</label>
                        <!-- Lista de escolha: cada opção envia o id; o conversor (config/Conversores.java) transforma o id no objeto -->
                        <select id="cliente" name="cliente" class="form-select" th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="item : ${clientes}" th:value="${item.id}" th:text="${item.nome}"
                                    th:selected="${agendamento.cliente != null and agendamento.cliente.id == item.id}">Cliente</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="servico">Serviço *</label>
                        <!-- Lista de escolha: cada opção envia o id; o conversor (config/Conversores.java) transforma o id no objeto -->
                        <select id="servico" name="servico" class="form-select" th:classappend="${#fields.hasErrors('servico')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="item : ${servicos}" th:value="${item.id}" th:text="${item.nome}"
                                    th:selected="${agendamento.servico != null and agendamento.servico.id == item.id}">Serviço</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('servico')}" th:errors="*{servico}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="data">Data *</label>
                        <input type="date" class="form-control" th:field="*{data}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('data')}" th:errors="*{data}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="horario">Horário *</label>
                        <input type="time" class="form-control" th:field="*{horario}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('horario')}" th:errors="*{horario}">Erro</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="observacao">Observação</label>
                        <textarea class="form-control" rows="3" th:field="*{observacao}" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('observacao')}" th:errors="*{observacao}">Erro</div>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/agendamentos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
