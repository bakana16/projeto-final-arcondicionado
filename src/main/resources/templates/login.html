<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="bg-light">

<main class="container">
    <div class="row justify-content-center" style="min-height: 90vh; align-items: center;">
        <div class="col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h5 mb-1" th:text="${appNome}">Meu Sistema</h1>
                    <p class="text-muted small mb-4">Informe seu usuário e senha para continuar.</p>

                    <!-- Mensagens: ?error (login inválido) e ?saiu (logout) -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 small">Usuário ou senha inválidos.</div>
                    <div th:if="${param.saiu}" class="alert alert-success py-2 small">Você saiu do sistema.</div>

                    <!-- O Spring Security recebe este formulário em POST /login.
                         Os nomes dos campos precisam ser "username" e "password". -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" id="username" name="username" class="form-control" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-app w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
