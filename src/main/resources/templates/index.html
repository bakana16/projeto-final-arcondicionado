<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
    PAINEL do sistema (página inicial): os indicadores mais importantes para quem gerencia o negócio.
    Os dados vêm do InicioController, que chama o PainelService.
-->
<head th:replace="~{fragments/layout :: head('Painel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Painel</h1>
        <span class="text-muted small" th:text="'Atualizado em ' + ${#temporals.format(agora, 'dd/MM/yyyy HH:mm')}">Atualizado em</span>
    </div>

    <!-- Cartões de indicadores: th:each repete o cartão para cada indicador da lista -->
    <div class="row g-3">
        <div class="col-sm-6 col-lg-3" th:each="ind : ${indicadores}">
            <div class="card shadow-sm h-100 border-0 border-start border-4" th:classappend="'border-' + ${ind.cor}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="text-muted small" th:text="${ind.titulo}">Indicador</span>
                        <i class="bi fs-4" th:classappend="${ind.icone} + ' text-' + ${ind.cor}"></i>
                    </div>
                    <div class="fs-3 fw-semibold" th:text="${ind.valor}">0</div>
                    <div class="small text-muted" th:text="${ind.detalhe}">detalhe</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <!-- Lista de atenção: o que precisa de ação agora -->
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold"><i class="bi bi-exclamation-circle me-1"></i> Agendamentos de hoje</div>
                <div class="card-body" th:if="${#lists.isEmpty(atencao)}">
                    <p class="text-muted mb-0">Nenhum agendamento para hoje.</p>
                </div>
                <div class="table-responsive" th:unless="${#lists.isEmpty(atencao)}">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                        <th>Horário</th>
                        <th>Cliente</th>
                        <th>Serviço</th>
                        <th>Situação</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="agendamento : ${atencao}">
                        <td th:text="${#temporals.format(agendamento.horario, 'HH:mm')}">08:00</td>
                        <td th:text="${agendamento.cliente.nome}">Cliente</td>
                        <td th:text="${agendamento.servico.nome}">Serviço</td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${agendamento.status.cor}" th:text="${agendamento.status.descricao}">Agendado</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white">
                    <a th:href="@{/agendamentos}" class="small">Ver todos os agendamentos <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>
        <!-- Gráfico (Chart.js): os números vêm do controller -->
        <div class="col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold"><i class="bi bi-bar-chart me-1"></i> Agendamentos por situação</div>
                <div class="card-body">
                    <canvas id="grafico" height="220"></canvas>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<!-- Biblioteca de gráficos Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- th:inline="javascript": o Thymeleaf escreve as listas do controller dentro do JavaScript -->
<script th:inline="javascript">
    const rotulos = /*[[${graficoRotulos}]]*/ [];
    const valores = /*[[${graficoValores}]]*/ [];
    new Chart(document.getElementById("grafico"), {
        type: "bar",
        data: {
            labels: rotulos,
            datasets: [{ label: "Quantidade", data: valores, backgroundColor: "#1f4e79" }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>
</body>
</html>
