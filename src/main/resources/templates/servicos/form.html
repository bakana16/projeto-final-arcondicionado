<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Serviços')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <!-- O mesmo formulário serve para cadastrar (id vazio) e para editar (id preenchido) -->
    <h1 class="h4 mb-3" th:text="${servico.id == null} ? 'Novo serviço' : 'Editar serviço'">Novo serviço</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- th:object liga o formulário ao objeto "servico"; *{campo} = um atributo desse objeto -->
            <form th:action="@{/servicos/salvar}" th:object="${servico}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome *</label>
                        <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="descricao">Descrição</label>
                        <textarea class="form-control" rows="3" th:field="*{descricao}" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="duracaoMinutos">Duração (min) *</label>
                        <input type="number" step="1" class="form-control" th:field="*{duracaoMinutos}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('duracaoMinutos')}" th:errors="*{duracaoMinutos}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="preco">Preço *</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{preco}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">Erro</div>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/servicos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
